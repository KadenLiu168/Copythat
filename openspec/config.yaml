schema: spec-driven

# 项目上下文（可选）
# 这部分内容会在 AI 起草任何 artifact 时被注入到 prompt。
# 写入技术栈、约定、风格指南、领域知识等。
context: |
  项目：Copythat — 一款原生 macOS 剪贴板历史应用，作为 SwiftPM 可执行文件以菜单栏常驻 `LSUIElement` 形态分发。

  技术栈：
  - Swift 5.x，macOS 14（`.v14`）
  - SwiftUI 负责表现层；AppKit / CoreGraphics 负责边界
  - SwiftPM（`Package.swift`）：单一 `executableTarget` + `Tests/` 测试目标
  - Swift Testing（`import Testing`，`@Test`）写单元测试
  - Carbon（`RegisterEventHotKey`）注册全局快捷键
  - `ServiceManagement`（`SMAppService.mainApp`）实现"启动登录"
  - `CoreGraphics.CGEvent.tap` 做复制源归因
  - `LinkPresentation.LPMetadataProvider` + `WKWebView` 做链接预览
  - `CryptoKit.SHA256` 生成稳定的图片内容键

  模块布局（`Sources/Copythat/`）：
  - `App/` — `@main` 入口 + `NSApplicationDelegate`
  - `Models/` — 领域类型（`ClipboardItem`、`ClipboardKind`）
  - `Stores/` — `AppModel`（根 ObservableObject）、`AppSettings`（UserDefaults）、
    `ClipboardStore`（状态 + 轮询 + 过滤）
  - `Services/` — AppKit 边界（Panel、Paste、Source tracker、HotKey、Accessibility）
  - `Support/` — 纯工具（Persistence、Policy、Resolution、Frame、Image、Time、Theme、Font）
  - `Views/` — SwiftUI 视图（BottomPanel、Card、Settings、VisualEffect）
  - `Resources/` — AppIcon + MenuBarIconTemplate

  约定：
  - UI 保持原生：system materials、semantic colors、system accent。
  - AppKit / CoreGraphics 边界放在 `Services/` 或 `Support/`，**禁止** 写在 `Views/` 内。
  - 复制源追踪**不**持久化。
  - 保留真实领域术语：paste、pasteboard、copy、cut、source。不要机械改名为"插入/剪贴板/复制副本/来源"。
  - 存储位置：`~/Library/Application Support/Copythat/clipboard-history.json`。

  行为的真值源：
  - 单元测试：`Tests/CopythatTests/*.swift`（Swift Testing）
  - 集成校验：`script/verify/*.swift` 与 `script/verify_all.sh`
  - 手工清单：`README.md` 的 "Verify" 段

  起草变更时：
  - Brownfield 优先：使用 `## MODIFIED Requirements` 更新现有 spec，不要写平行真值。
  - 默认 Lite spec；仅在 API/契约变更、安全/隐私关注、迁移场景升级为 full spec。

# 各 artifact 的规则（可选）
# 为特定 artifact 写入自定义规则。
# 这些规则是 `README.md → Development Guidelines` 的镜像，会被逐字注入到
# AI 起草该 artifact 的 prompt 末尾。它们是硬约束，不是提示——
# 如果草稿违反，请重新生成。
rules:
  proposal:
    - 提案不超过 500 词。
    - 始终包含 "Non-goals" 段。
  design:
    - AppKit、Carbon、CoreGraphics 与 `NSPasteboard` 边界 MUST 放在
      `Sources/Copythat/Services/`（有状态）或 `Sources/Copythat/Support/`
      （纯函数）。禁止在 `Views/` 内联。
    - SwiftUI 视图（`Views/`）MUST 保持声明式：只负责展示、布局、手势绑定、
      `@Published` 绑定。副作用、轮询、文件 IO、`CGEvent` 一律去别处。
    - 保留真实领域术语——禁止在 spec/proposal/design/tasks 文本中把
      "paste" 改成 "insert"、"pasteboard" 改成 "clipboard"、"copy" 改成
      "duplicate"、"source" 改成 "origin"。
    - UI MUST 优先 system materials、semantic colors、system accent。
      禁止写死自定义调色板。
    - 设计变更 MUST 引用现有源文件以及（如适用）锁定当前行为的测试/verify 脚本。
  tasks:
    - 每个 task 切片不超过 2 小时。
    - 按层级编号（1.1、1.2、…）。
    - 每个 task MUST 标明目标文件路径（位于 `Sources/Copythat/`
      或 `Tests/CopythatTests/`），让实现者无需猜测。
    - 涉及 AppKit / CoreGraphics 的 task MUST 落在 `Services/` 或 `Support/`，
      禁止在 `Views/`。
    - 最后一条永远是 "Run ./script/verify_all.sh"，作为变更完成的门槛。
  specs:
    - Scenario 使用 Given/When/Then。
    - 引用锁定行为的源文件或测试。
    - Spec 描述可观测的行为，**不**写实现。不要在 spec.md 中出现类名、库选择、
      步骤细节——这些属于 `design.md` 与 `tasks.md`。
    - 保留真实领域术语（paste / pasteboard / copy / cut / source）。
